name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove stale lockfile
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install compatible type packages
        run: npm install --save-dev typescript@3.9.10 @types/node@14.18.63 @types/express@4.17.6 @types/express-serve-static-core@4.17.19 @types/jquery@3.3.31

      - name: Build project
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build
